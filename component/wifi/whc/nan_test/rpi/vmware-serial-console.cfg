# Install as /etc/default/grub.d/99-green2-serial.cfg, then run update-grub.
# VMware serial0 must exist and be connected before rebooting the guest.
GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX} console=tty0 console=ttyS0,115200n8 earlycon=uart8250,io,0x3f8,115200n8 loglevel=7 ignore_loglevel log_buf_len=4M panic=0"
GRUB_TERMINAL_INPUT="console serial"
GRUB_TERMINAL_OUTPUT="console serial"
GRUB_SERIAL_COMMAND="serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1"
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=3
