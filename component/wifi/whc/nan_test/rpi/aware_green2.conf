{
  "bin_path": {
    "iw": { "iw_path": "/usr/sbin/iw" },
    "nan_r3": { "nan_r3_path": "/usr/local/bin/nan_r3" },
    "wpa_supplicant": {
      "wpa_supplicant_path": "/usr/sbin/wpa_supplicant",
      "wpa_supplicant_conf_path": "/dev/null",
      "wpa_supplicant_log_file": "/run/green2-nan/supplicant.log",
      "wpa_supplicant_dbg_para": "-dd"
    }
  },
  "basic": { "mac_addr": "00:00:00:00:00:00" },
  "dns_sd_record": {
    "publish1": {
      "publish_id": "1",
      "service_name": "_flashstudio._tcp",
      "name_of_service_instance": "Green2 NAN",
      "textinfo": "0x0E | vendorName=RTK | 0x15 | pairingName=Green2NAN | 0x13 | modelName=RTL8711Dx",
      "hostname": "green2",
      "port_number": "8000",
      "security": "pairing",
      "start_cmd": "/bin/true",
      "end_cmd": "/bin/true",
      "bstrap_method": "pin_code",
      "pairing_passphrase": "123456",
      "nik_caching": "1",
      "gtk_enable": "1"
    }
  }
}
