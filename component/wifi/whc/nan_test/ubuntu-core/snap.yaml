name: green2-nan-ble
version: '20261110.14'
summary: Green2 USB NAN and BLE integration test
description: |
  Development test services for a Green2 flash-boot USB composite device.
  Requires a matching WHC USB kernel module and the Green2 btusb exception.
base: core26
architectures: [amd64]
grade: devel
confinement: devmode
apps:
  camera:
    command: bin/run-camera
    command-chain: [bin/environment]
    daemon: simple
    after: [nan]
    restart-condition: on-failure
    restart-delay: 5s
    stop-timeout: 15s
    plugs: [camera, hardware-observe, network, network-bind]
  nan:
    command: bin/run-nan
    command-chain: [bin/environment]
    daemon: simple
    restart-condition: on-failure
    restart-delay: 5s
    stop-timeout: 20s
    plugs: [network, network-bind, network-control, network-observe, hardware-observe]
  ble:
    command: bin/run-ble
    command-chain: [bin/environment]
    daemon: simple
    restart-condition: on-failure
    restart-delay: 5s
    stop-timeout: 10s
    plugs: [bluez, hardware-observe]
  status:
    command: bin/status
    command-chain: [bin/environment]
    plugs: [network-control, bluez, hardware-observe]
layout:
  /var/lib/nan:
    bind: $SNAP_COMMON/nan
